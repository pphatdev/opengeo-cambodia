services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: opengeo-cambodia:latest
    container_name: opengeo-cambodia
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
