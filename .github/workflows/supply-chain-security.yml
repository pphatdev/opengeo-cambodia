name: Supply Chain Security Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly scheduled security scan (Every Monday at 04:00 UTC)
    - cron: '0 4 * * 1'

# Least Privilege: Restrict default GITHUB_TOKEN permissions
permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit & Lockfile Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Verify Lockfile Integrity & Frozen Dependencies
        run: deno install --frozen

      - name: Run Deno Security Audit
        run: deno audit

      - name: Type Check (deno check + web tsc)
        run: deno task lint

  dependency-review:
    name: Dependency Review (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-1.0-only, GPL-1.0-or-later
