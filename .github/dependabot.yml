version: 2
updates:
  # npm packages are pinned in deno.json; Dependabot has no Deno ecosystem, so update them with `deno outdated --update`

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "security"
      - "ci"
