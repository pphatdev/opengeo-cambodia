<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- OpenGeo Signature Gradients -->
    <linearGradient id="opengeo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="opengeo-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="opengeo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for soft ambient glow on dark themes -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-rect { fill: transparent; }
      .crest-shape { fill: url(#opengeo-accent); }
      .body-shape { fill: url(#opengeo-gradient); filter: drop-shadow(0 6px 16px rgba(13, 148, 136, 0.25)); }
      .pin-inner { fill: #0a0b10; }
      .compass-star { fill: #38bdf8; opacity: 0.9; }
      .contour-line { stroke: rgba(255, 255, 255, 0.22); stroke-width: 1.5; fill: none; stroke-linecap: round; }

      @media (prefers-color-scheme: light) {
        .pin-inner { fill: #ffffff; }
        .contour-line { stroke: rgba(255, 255, 255, 0.35); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" class="bg-rect" rx="104" />

  <!-- Ambient Backdrop Light -->
  <circle cx="280" cy="260" r="180" fill="url(#opengeo-glow)" filter="blur(40px)" />

  <!-- Khmer 'ស' Crest (Top Hair Accent / សក់) with Beveled Bottom-Left -->
  <path
    class="crest-shape"
    d="M 124 116
       L 262 116
       A 6 6 0 0 1 268 122
       L 268 172
       A 6 6 0 0 1 262 178
       L 152 178
       L 100 134
       A 8 8 0 0 1 106 122
       L 118 118
       A 8 8 0 0 1 124 116 Z"
  />

  <!-- Main Body of Khmer 'ស' with Seamless Geographic Location Pin & Contours -->
  <!-- Continuous ribbon geometry modeled after Sophat's signature brand -->
  <g class="body-shape">
    <!-- Main Ribbon Stroke -->
    <path
      d="
        M 108 206
        C 108 190, 122 178, 138 178
        L 240 178
        C 290 178, 326 214, 326 264
        C 326 314, 302 338, 276 348
        C 254 356, 236 346, 222 334
        C 206 320, 192 300, 178 280
        C 166 262, 148 248, 124 248
        C 94 248, 70 272, 70 302
        L 70 348
        C 70 388, 102 420, 142 420
        C 178 420, 208 394, 218 360
        C 226 332, 244 324, 260 324
        C 284 324, 306 342, 326 372
        C 346 402, 376 420, 412 420
        C 438 420, 460 404, 460 376
        L 460 216
        C 460 162, 416 118, 362 118
        C 308 118, 264 162, 264 216
        C 264 246, 280 276, 306 304
        L 362 364
        L 404 316
        C 382 292, 370 268, 370 244
        C 370 220, 390 200, 414 200
        C 438 200, 458 220, 458 244
        L 458 356
        C 458 368, 448 376, 436 376
        C 420 376, 404 364, 392 344
        L 348 274
        C 366 244, 382 208, 382 172
        C 382 144, 360 122, 332 122
        C 304 122, 282 144, 282 172
        L 282 228
        C 282 268, 252 298, 212 298
        C 186 298, 164 282, 154 260
        L 154 340
        C 154 354, 142 366, 128 366
        C 114 366, 102 354, 102 340
        L 102 240
        C 102 222, 105 212, 108 206 Z
      "
    />

    <!-- Geographic Location Pin Accent Head (integrated seamlessly into right arm) -->
    <path
      d="
        M 386 120
        C 346 120, 314 152, 314 192
        C 314 234, 360 292, 386 318
        C 412 292, 458 234, 458 192
        C 458 152, 426 120, 386 120 Z
      "
    />
  </g>

  <!-- Location Pin Interior Coordinate Eye -->
  <circle cx="386" cy="186" r="28" class="pin-inner" />

  <!-- Inner Glowing Coordinate Radar Dot -->
  <circle cx="386" cy="186" r="14" fill="url(#opengeo-gradient)" />

  <!-- Geographic Cartography Contour Lines (Topographic elevation motifs) -->
  <path
    class="contour-line"
    d="M 334 192 C 344 164, 370 148, 386 148 C 402 148, 428 164, 438 192"
  />
  <path
    class="contour-line"
    d="M 346 220 C 358 242, 376 262, 386 274 C 396 262, 414 242, 426 220"
  />
  <path
    class="contour-line"
    d="M 120 300 C 136 290, 160 304, 180 324"
  />

  <!-- 4-Point Navigation Compass Star -->
  <g transform="translate(320, 330) scale(0.85)">
    <path
      class="compass-star"
      d="M 0 -18 Q 2 -4 18 0 Q 2 4 0 18 Q -2 4 -18 0 Q -2 -4 0 -18 Z"
    />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>
</svg>
