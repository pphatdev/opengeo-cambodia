<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Palette (Default) -->
    <style>
      :root {
        --crest-fill: #14b8a6;
        --body-fill: #ffffff;
      }
      .sa-crest {
        fill: var(--crest-fill);
      }
      .sa-body {
        fill: var(--body-fill);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --crest-fill: #005970;
          --body-fill: #050814;
        }
      }
    </style>
  </defs>

  <!-- Khmer Letter 'ស' (Sa) Crest / Accent Bar (សក់) with Chamfered Lower-Left Edge -->
  <path
    class="sa-crest"
    d="M 100 115
       L 262 115
       C 266 115 268 117 268 121
       L 268 172
       L 155 172
       L 80 212
       L 80 145
       C 80 128 88 115 100 115 Z"
  />

  <!-- Khmer Letter 'ស' (Sa) Main Body - Smooth Rounded Geometry -->
  <path
    class="sa-body"
    fill-rule="evenodd"
    d="
      M 195 192
      C 155 192 120 205 95 228
      L 95 365
      C 95 405 130 435 175 435
      C 225 435 255 395 268 375
      C 280 395 310 435 360 435
      C 410 435 442 395 442 345
      L 442 165
      L 412 165
      C 412 185 398 200 378 200
      L 378 340
      C 378 372 360 395 330 395
      C 295 395 270 365 255 330
      C 240 295 240 240 240 230
      C 238 208 220 192 195 192 Z

      M 145 285
      C 165 285 180 300 180 325
      C 180 350 165 375 145 375
      C 130 375 125 362 125 345
      L 125 305
      C 125 292 132 285 145 285 Z
    "
  />
</svg>
